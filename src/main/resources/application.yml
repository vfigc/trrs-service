server:
  port: 8081
aws:
  region: eu-west-1
spring:
  application:
    name: trrs-service
  datasource:
    url: jdbc:postgresql://vf-inthub-dev-db.c9yky2kw470b.eu-west-1.rds.amazonaws.com:5432/vfi_inthub_dev
    driver-class-name: org.postgresql.Driver
    username: app_user
    password: AppUserIntHub
  jpa:
    properties:
      hibernate:
        default_schema: trrs
    hibernate:
      ddl-auto: validate
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
internal-auth:
  # {algorithm, activeKid, previousKid, keys: {kid: base64 HMAC key}} - the SAME Secrets Manager
  # secret integration-layer's InternalServiceTokenIssuer signs with, so both sides always agree
  # on the current key(s) without a manually-synchronized deployment. Resolved once at startup by
  # InternalServiceAuthFilter; every kid present in the secret's keys map is accepted, so adding a
  # new kid ahead of integration-layer's own rotation is always safe.
  secret-arn: "arn:aws:secretsmanager:eu-west-1:482311061893:secret:vfi/inthub/platform/dev/svc-auth-hmac-SvHJuN"
